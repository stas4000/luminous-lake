<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a1420" />
  <title>Luminous Lake</title>
  <meta name="description" content="A cinematic reflective lake surrounded by a living forest. Dynamic weather, wildlife, and time of day — rendered in real time." />
  <style>
    :root {
      --glass: rgba(12, 20, 30, 0.55);
      --glass-border: rgba(255, 255, 255, 0.14);
      --text: #e8f0f8;
      --text-dim: #9fb2c4;
      --accent: #7fd4c1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      overflow: hidden;
      background: #0a1420;
      font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    #scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }
    #ui { position: fixed; inset: 0; pointer-events: none; z-index: 10; }

    /* ---------- title ---------- */
    #title {
      position: absolute;
      top: calc(14px + env(safe-area-inset-top));
      left: calc(18px + env(safe-area-inset-left));
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text);
      text-shadow: 0 1px 12px rgba(0, 0, 0, 0.55);
      display: flex;
      align-items: center;
      gap: 9px;
      user-select: none;
    }
    .title-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
    }

    /* ---------- panel ---------- */
    #panel {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(14px + env(safe-area-inset-bottom));
      width: min(680px, calc(100vw - 24px - env(safe-area-inset-left) - env(safe-area-inset-right)));
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      backdrop-filter: blur(18px) saturate(1.3);
      -webkit-backdrop-filter: blur(18px) saturate(1.3);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      pointer-events: auto;
      overflow: hidden;
      transition: transform 0.35s cubic-bezier(0.32, 0.72, 0.28, 1);
    }
    #panel.collapsed { transform: translateX(-50%) translateY(calc(100% - 46px)); }

    #panel-handle {
      width: 100%;
      min-height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: transparent;
      border: none;
      color: var(--text-dim);
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
    }
    #panel-handle:hover { color: var(--text); }
    #panel-handle .chev { font-size: 13px; }

    #panel-body {
      padding: 2px 18px 18px;
      /* never dominate the screen, even on short landscape phones */
      max-height: calc(55vh - 46px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* ---------- camera segmented ---------- */
    #camera-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      padding: 4px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      margin-bottom: 14px;
    }
    .cam-btn {
      min-height: 44px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--text-dim);
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .cam-btn:hover { color: var(--text); }
    .cam-btn.active {
      background: rgba(127, 212, 193, 0.22);
      color: var(--accent);
      box-shadow: inset 0 0 0 1px rgba(127, 212, 193, 0.4);
    }

    /* ---------- sliders ---------- */
    #slider-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 22px;
      row-gap: 10px;
    }
    .slider-wrap { display: flex; flex-direction: column; gap: 4px; }
    .slider-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-dim);
    }
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 28px;
      background: transparent;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-runnable-track {
      height: 5px;
      border-radius: 3px;
      background: linear-gradient(90deg, rgba(127, 212, 193, 0.55), rgba(127, 212, 193, 0.15));
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      margin-top: -7.5px;
      border-radius: 50%;
      background: #f2fbf8;
      border: 2px solid var(--accent);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }
    input[type="range"]::-moz-range-track {
      height: 5px;
      border-radius: 3px;
      background: linear-gradient(90deg, rgba(127, 212, 193, 0.55), rgba(127, 212, 193, 0.15));
    }
    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #f2fbf8;
      border: 2px solid var(--accent);
    }

    /* ---------- loading ---------- */
    #loading {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(120% 100% at 50% 20%, #12253a 0%, #0a1420 70%);
      transition: opacity 0.9s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    .load-card { text-align: center; }
    .load-card h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    .load-card p { color: var(--text-dim); font-size: 14px; }
    .load-pulse {
      width: 44px;
      height: 44px;
      margin: 0 auto 18px;
      border-radius: 50%;
      border: 2px solid rgba(127, 212, 193, 0.25);
      border-top-color: var(--accent);
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 620px) {
      #slider-grid { grid-template-columns: 1fr; row-gap: 6px; }
      #panel-body { padding: 2px 14px 12px; }
      #title { font-size: 13px; }
      .cam-btn { font-size: 12px; }
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="ui"></div>
  <div id="loading">
    <div class="load-card">
      <div class="load-pulse"></div>
      <h1>Luminous Lake</h1>
      <p>Preparing the water…</p>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
